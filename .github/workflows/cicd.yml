name: Deploy Angular app
on:
  push:
    branches: [ practice/deployment ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: login to docker hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
      - name: Build docker image
        run:
          docker build -t "${{ secrets.DOCKER_USERNAME }}"/healthcare-frontend:latest .
      - name: Push image to Docker Hub
        run:
          docker push ${{ secrets.DOCKER_USERNAME }}/healthcare-frontend:latest

  deploy:
    needs: build
    runs-on: angular-actions-runner
    steps:
      - name: Pull image from Docker Hub
        run: docker pull ${{ secrets.DOCKER_USERNAME }}/healthcare-frontend:latest
      - name: Remove old container
        run: |
          docker stop frontend || true
          docker rm frontend || true
      - name: Run Docker container
        run: docker run -d -p 80:80 --name frontend ${{ secrets.DOCKER_USERNAME }}/healthcare-frontend:latest